[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icd-document-editor"
version = "0.1.0"
description = "NASA ICD PDF Conversion and Regeneration Pipeline"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "pydantic==2.11.3",
    "pyyaml==6.0.2",
    "pymupdf==1.25.5",
    "pdfplumber==0.11.6",
    "pikepdf==9.7.0",
    "Pillow==11.2.1",
    "numpy==2.2.6",
    "weasyprint==69.0",
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "jinja2==3.1.6",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=2.7.0",
    "pytesseract==0.3.13",
]
docling = [
    "docling>=2.0.0",
]
rendering = [
    "weasyprint==63.1",
]
tables = [
    "camelot-py[cv]==0.11.0",
]
search = [
    "opensearch-py==2.8.0",
]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
    "ruff==0.11.12",
    "mypy==1.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
